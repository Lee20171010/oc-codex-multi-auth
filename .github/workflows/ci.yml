name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Manual trigger. Lets a maintainer run the full gate on any ref from the
  # Actions tab without pushing a throwaway commit — useful for confirming the
  # pipeline itself works, and for re-running against a branch after an
  # infrastructure problem rather than a code change.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the declared minimum and the current desktop runtime.
        node: ['22.19.0', '24']
        os: [ubuntu-latest]
        include:
          - node: '24'
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build must precede Test: dist/ is gitignored, and the standalone CLI
      # tests load the compiled warm/limits runtime out of dist/.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Exercise the packed CLI on supported runtimes as a consumer would.
  consumer-smoke:
    name: Consumer smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm pack` runs prepack, not prepublishOnly, so dist/ must be built here
      # or the tarball ships without its compiled runtime.
      - name: Build
        run: npm run build

      - name: Pack the installable tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball and run the CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/oc-codex-multi-auth-*.tgz
          node node_modules/oc-codex-multi-auth/scripts/install-oc-codex-multi-auth.js status --json > status.json
          cat status.json
          node -e '
            const { readFileSync } = require("node:fs");
            const status = JSON.parse(readFileSync("status.json", "utf8"));
            if (status.command !== "status") {
              throw new Error("expected command status, got " + JSON.stringify(status.command));
            }
            if (typeof status.totalAccounts !== "number") {
              throw new Error("status output is missing totalAccounts");
            }
          '

  audit-ci:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies and dev allowlist
        run: npm run audit:ci
